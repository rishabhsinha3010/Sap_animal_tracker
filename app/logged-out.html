<!DOCTYPE html>
<!-- Shown after "Sign out" (logoutPage in app/router/xs-app.json). Public page: no login needed to see it. -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signed out · Animal Adoption Tracker</title>
    <style>
        :root { --bg: #f5f6f7; --surface: #ffffff; --text: #1d2d3e; --muted: #556b82; --border: #e5e9ee; --brand: #0070f2; }
        @media (prefers-color-scheme: dark) {
            :root { --bg: #12171c; --surface: #1d232a; --text: #eaecee; --muted: #a9b4be; --border: #2c343d; --brand: #4db1ff; }
        }
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
            font-family: "72", "72full", -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
            background: var(--bg); color: var(--text);
        }
        .card { max-width: 420px; width: 100%; padding: 32px; border-radius: 16px; text-align: center;
                background: var(--surface); border: 1px solid var(--border); }
        .logo { width: 56px; height: 56px; }
        h1 { font-size: 22px; margin: 16px 0 8px; }
        p { color: var(--muted); line-height: 1.6; margin: 0 0 24px; }
        a.button { display: inline-block; padding: 10px 20px; border-radius: 8px; background: var(--brand);
                   color: #fff; text-decoration: none; font-weight: 600; }
        a.button:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
    </style>
</head>
<body>
    <div class="card">
        <img class="logo" src="shared/logo.svg" alt="">
        <h1>You have signed out</h1>
        <p>Thank you for using the Animal Adoption Tracker.</p>
        <a class="button" href="./">Sign in again</a>
    </div>
</body>
</html>
