<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animal Adoption · Admin</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
        }
        /* top bar (app/shared/AppShell.js) above the app, the app gets the rest of the height */
        #shellbar {
            height: 3.25rem;
        }
        #app > div, #container, #container-uiarea {
            height: 100%;
        }
        #app {
            height: calc(100% - 3.25rem);
        }
    </style>
    <script
        id="sap-ui-bootstrap"
        src="https://sapui5.hana.ondemand.com/1.153.0/resources/sap-ui-core.js"
        data-sap-ui-theme="sap_horizon"
        data-sap-ui-resource-roots='{
            "animaladoption.admin": "./",
            "animaladoption.shared": "../shared/"
        }'
        data-sap-ui-on-init="module:sap/ui/core/ComponentSupport"
        data-sap-ui-compat-version="edge"
        data-sap-ui-async="true"
        data-sap-ui-frame-options="trusted"
    ></script>
</head>
<body class="sapUiBody sapUiSizeCompact" id="content">
    <div id="shellbar"></div>
    <div id="app">
    <div
        data-sap-ui-component
        data-name="animaladoption.admin"
        data-id="container"
        data-settings='{"id" : "animaladoption.admin"}'
        data-handle-validation="true"
    ></div>
    </div>
</body>
</html>
